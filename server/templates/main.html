<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Batch Audio Upload</title>
</head>
<body>

  <div class="container my-4">

    <h1 class="text-center display-3 mb-4">
      Upload a Folder of Audio Files
    </h1>

    <div class="input-group mb-3">
      <input type="file" class="form-control" id="folderInput" webkitdirectory directory multiple />
      <label class="input-group-text" for="folderInput">Upload</label>
    </div>

    <div class="col-auto mb-3">
      <button id="uploadBtn" class="btn btn-primary">Process Audios</button>
    </div>

    <div id="status" class="mb-3"></div>

    <!-- Container for showing the table -->
    <div id="resultsContainer" style="display:none;">
      <h3>Results:</h3>
      <div class="table-responsive">
        <table id="resultsTable" class="table table-bordered table-striped table-hover">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <button id="downloadBtn" class="btn btn-success">Download Excel File</button>
    </div>

  </div>

  <script>
    const folderInput = document.getElementById('folderInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const status = document.getElementById('status');
    const resultsContainer = document.getElementById('resultsContainer');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const downloadBtn = document.getElementById('downloadBtn');

    uploadBtn.addEventListener('click', async () => {
      const files = folderInput.files;
      if (files.length === 0) {
        status.innerText = 'Please select a folder.';
        status.style.color = 'red';
        return;
      }

      const formData = new FormData();
      for (const file of files) {
        formData.append('audios', file);
      }

      status.innerText = 'Uploading and processing...';
      status.style.color = 'black';
      resultsContainer.style.display = 'none';  // hide previous results

      try {
        const res = await fetch('/process_folder', {
          method: 'POST',
          body: formData,
        });

        if (!res.ok) {
          throw new Error('Request failed');
        }

        const data = await res.json();

        // Show table headers
        tableHead.innerHTML = '';
        const headerRow = document.createElement('tr');
        data.headers.forEach(header => {
          const th = document.createElement('th');
          th.textContent = header;
          headerRow.appendChild(th);
        });
        tableHead.appendChild(headerRow);

        // Show table rows
        tableBody.innerHTML = '';

        const qualStatusIndex = data.headers.findIndex(h => h.toLowerCase().includes('qualification status') || h.toLowerCase().includes('qualified status'));

data.rows.forEach(row => {
  const tr = document.createElement('tr');
  row.forEach((cell, index) => {
    const td = document.createElement('td');
    td.textContent = cell;

    // Apply coloring based on Qualification Status
    if (index === qualStatusIndex) {
      const cellText = cell.toLowerCase();
      if (cellText.includes('qualified') && !cellText.includes('not')) {
        td.style.backgroundColor = '#c6efce'; // light green
        td.style.color = '#006100'; // dark green text
      } else if (cellText.includes('not qualified')) {
        td.style.backgroundColor = '#ffc7ce'; // light red
        td.style.color = '#9c0006'; // dark red text
      }
    }

    tr.appendChild(td);
  });
  tableBody.appendChild(tr);
});

        // Show the results container
        resultsContainer.style.display = 'block';

        // Setup the download button link
        downloadBtn.onclick = () => {
          window.open('http://127.0.0.1:5000' + data.excel_download_url, '_blank');
        };

        status.innerText = 'Processing complete. Results shown below.';
        status.style.color = 'green';

      } catch (error) {
        console.error('Error:', error);
        status.innerText = 'An error occurred while processing.';
        status.style.color = 'red';
      }
    });
  </script>

</body>
</html>
